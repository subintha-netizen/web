<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A4 Image Layout - จัดเรียงรูปภาพบนกระดาษ A4</title>

    <!-- Tailwind CSS CDN v3.4.1 -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts - Sarabun -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:ital,wght@0,300;0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">

    <!-- Lucide Icons CDN v0.294.0 -->
    <script src="https://unpkg.com/lucide@0.294.0/dist/umd/lucide.min.js"></script>

    <!-- html2canvas v1.4.1 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <!-- jsPDF v2.5.1 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        * {
            font-family: 'Sarabun', 'Inter', sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        /* A4 Paper aspect ratio 210:297 */
        .a4-container {
            aspect-ratio: 210 / 297;
            background: white;
            position: relative;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }

        /* Custom scrollbar */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 3px;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #555;
        }

        /* Object styles */
        .canvas-object {
            position: absolute;
            cursor: move;
            touch-action: none;
            user-select: none;
        }

        .canvas-object.selected {
            outline: 2px solid #3B82F6;
            outline-offset: 2px;
        }

        .canvas-object img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            pointer-events: none;
        }

        /* Resize handle */
        .resize-handle {
            position: absolute;
            bottom: -4px;
            right: -4px;
            width: 12px;
            height: 12px;
            background: #3B82F6;
            border: 2px solid white;
            border-radius: 50%;
            cursor: nwse-resize;
            z-index: 10;
        }

        /* Control buttons */
        .control-buttons {
            position: absolute;
            top: -36px;
            right: 0;
            display: flex;
            gap: 4px;
            z-index: 20;
        }

        .control-btn {
            width: 28px;
            height: 28px;
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .control-btn:hover {
            background: #f3f4f6;
            border-color: #3B82F6;
        }

        /* Signature canvas */
        .signature-canvas {
            border: 2px dashed #cbd5e1;
            background: rgba(255, 255, 255, 0.9);
            cursor: crosshair;
        }

        /* Loading overlay */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }

        .loading-spinner {
            width: 48px;
            height: 48px;
            border: 4px solid #f3f4f6;
            border-top-color: #3B82F6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Text certification styles */
        .cert-text {
            padding: 12px;
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 4px;
            cursor: move;
            line-height: 1.5;
            min-width: 200px;
        }

        .cert-line-1 {
            font-weight: 600;
            text-align: center;
        }

        .cert-line-2 {
            text-align: center;
        }

        .cert-line-3 {
            font-style: italic;
            text-align: center;
        }

        /* Responsive mobile */
        @media (max-width: 768px) {
            .sidebar-mobile {
                max-height: 45vh;
                overflow-y: auto;
            }
        }
    </style>
</head>
<body class="bg-gray-100">
    <!-- Loading Overlay (hidden by default) -->
    <div id="loadingOverlay" class="loading-overlay" style="display: none;">
        <div class="loading-spinner"></div>
    </div>

    <!-- Main Container -->
    <div class="h-screen flex flex-col md:flex-row">
        <!-- Sidebar -->
        <div class="w-full md:w-80 bg-white border-b md:border-r border-gray-200 sidebar-mobile custom-scrollbar overflow-y-auto flex-shrink-0">
            <div class="p-4 space-y-4">
                <!-- Title -->
                <div class="text-center md:text-left">
                    <h1 class="text-xl font-bold text-gray-800">A4 Image Layout</h1>
                    <p class="text-sm text-gray-600">จัดเรียงรูปภาพบนกระดาษ A4</p>
                </div>

                <!-- Upload Images -->
                <div class="space-y-2">
                    <label class="block text-sm font-semibold text-gray-700">อัปโหลดรูปภาพ</label>
                    <div class="relative">
                        <input
                            type="file"
                            id="imageUpload"
                            accept=".jpg,.jpeg,.png,.gif,.webp"
                            multiple
                            class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer"
                            aria-label="อัปโหลดรูปภาพ"
                        />
                    </div>
                    <p class="text-xs text-gray-500">รองรับ: .jpg, .png, .gif, .webp</p>
                </div>

                <!-- Certification Text -->
                <div class="space-y-3 border-t pt-4">
                    <div class="flex items-center gap-2">
                        <input
                            type="checkbox"
                            id="showCertText"
                            class="w-4 h-4 text-blue-600 rounded focus:ring-2 focus:ring-blue-500"
                            aria-label="แสดงข้อความรับรองสำเนา"
                        />
                        <label for="showCertText" class="text-sm font-semibold text-gray-700 cursor-pointer">
                            แสดงข้อความ "รับรองสำเนาถูกต้อง"
                        </label>
                    </div>

                    <div id="certTextControls" style="display: none;" class="space-y-3">
                        <div>
                            <label for="certName" class="block text-xs font-medium text-gray-700 mb-1">
                                ชื่อผู้รับรอง
                            </label>
                            <input
                                type="text"
                                id="certName"
                                placeholder="(นายสมศักดิ์ รักชาติ)"
                                class="w-full px-3 py-2 border border-gray-300 rounded text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                                aria-label="ชื่อผู้รับรอง"
                            />
                        </div>

                        <div>
                            <label class="block text-xs font-medium text-gray-700 mb-1">
                                ระยะห่าง "สำเนาถูกต้อง" ↔ "ชื่อผู้รับรอง": <span id="gap1Value">8</span>px
                            </label>
                            <input
                                type="range"
                                id="gap1Slider"
                                min="0"
                                max="30"
                                value="8"
                                class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer"
                                aria-label="ระยะห่างบรรทัดที่ 1"
                            />
                        </div>

                        <div>
                            <label class="block text-xs font-medium text-gray-700 mb-1">
                                ระยะห่าง "ชื่อผู้รับรอง" ↔ "วันที่": <span id="gap2Value">8</span>px
                            </label>
                            <input
                                type="range"
                                id="gap2Slider"
                                min="0"
                                max="30"
                                value="8"
                                class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer"
                                aria-label="ระยะห่างบรรทัดที่ 2"
                            />
                        </div>
                    </div>
                </div>

                <!-- Add Signature -->
                <div class="border-t pt-4">
                    <button
                        id="addSignatureBtn"
                        class="w-full px-4 py-2 bg-purple-600 text-white rounded hover:bg-purple-700 transition flex items-center justify-center gap-2"
                        aria-label="เพิ่มลายเซ็น"
                    >
                        <i data-lucide="pen-line" class="w-4 h-4"></i>
                        <span>เพิ่มลายเซ็น</span>
                    </button>
                </div>

                <!-- Download Section -->
                <div class="space-y-3 border-t pt-4">
                    <label class="block text-sm font-semibold text-gray-700">ดาวน์โหลด</label>

                    <div>
                        <label for="exportFormat" class="block text-xs font-medium text-gray-700 mb-1">
                            รูปแบบไฟล์
                        </label>
                        <select
                            id="exportFormat"
                            class="w-full px-3 py-2 border border-gray-300 rounded text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                            aria-label="เลือกรูปแบบไฟล์"
                        >
                            <option value="jpg">JPG (.jpg)</option>
                            <option value="pdf">PDF (.pdf)</option>
                        </select>
                    </div>

                    <button
                        id="downloadBtn"
                        class="w-full px-4 py-2 bg-green-600 text-white rounded hover:bg-green-700 transition flex items-center justify-center gap-2"
                        aria-label="ดาวน์โหลดไฟล์"
                    >
                        <i data-lucide="download" class="w-4 h-4"></i>
                        <span>ดาวน์โหลด</span>
                    </button>
                </div>

                <!-- Instructions (collapsible on mobile) -->
                <div class="border-t pt-4">
                    <button
                        id="toggleInstructions"
                        class="w-full flex items-center justify-between text-sm font-semibold text-gray-700 md:cursor-default"
                    >
                        <span>วิธีใช้</span>
                        <i data-lucide="chevron-down" class="w-4 h-4 md:hidden"></i>
                    </button>
                    <div id="instructionsContent" class="mt-2 text-xs text-gray-600 space-y-1 hidden md:block">
                        <p>• อัปโหลดรูปภาพหลายไฟล์พร้อมกัน</p>
                        <p>• คลิกเพื่อเลือก ลากเพื่อย้าย</p>
                        <p>• ใช้ปุ่มควบคุมเพื่อหมุนหรือลบ</p>
                        <p>• ปรับขนาดด้วยจุดมุมขวาล่าง</p>
                        <p>• วาดลายเซ็นด้วยเมาส์หรือนิ้ว</p>
                        <p>• ดาวน์โหลดเป็น JPG หรือ PDF</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- A4 Canvas Area -->
        <div class="flex-1 flex items-center justify-center p-4 md:p-8 overflow-auto custom-scrollbar">
            <div class="w-full max-w-3xl">
                <div id="a4Paper" class="a4-container" role="main" aria-label="พื้นที่กระดาษ A4">
                    <!-- Objects will be added here dynamically -->
                </div>
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // A4 Image Layout Application
        // Version: 1.0
        // Libraries: Tailwind CSS, Lucide Icons, html2canvas, jsPDF
        // ============================================

        (function() {
            'use strict';

            // ============================================
            // State Management
            // ============================================
            const state = {
                objects: [],
                selectedObjectId: null,
                nextObjectId: 1,
                isDragging: false,
                isResizing: false,
                isDrawing: false,
                dragStartX: 0,
                dragStartY: 0,
                initialObjectX: 0,
                initialObjectY: 0,
                initialObjectWidth: 0,
                initialObjectHeight: 0,
                referenceImageWidth: null,
                referenceImageHeight: null,
                certTextSettings: {
                    show: false,
                    name: '',
                    gap1: 8,
                    gap2: 8
                }
            };

            // ============================================
            // DOM Elements
            // ============================================
            const elements = {
                a4Paper: document.getElementById('a4Paper'),
                imageUpload: document.getElementById('imageUpload'),
                showCertText: document.getElementById('showCertText'),
                certTextControls: document.getElementById('certTextControls'),
                certName: document.getElementById('certName'),
                gap1Slider: document.getElementById('gap1Slider'),
                gap2Slider: document.getElementById('gap2Slider'),
                gap1Value: document.getElementById('gap1Value'),
                gap2Value: document.getElementById('gap2Value'),
                addSignatureBtn: document.getElementById('addSignatureBtn'),
                downloadBtn: document.getElementById('downloadBtn'),
                exportFormat: document.getElementById('exportFormat'),
                loadingOverlay: document.getElementById('loadingOverlay'),
                toggleInstructions: document.getElementById('toggleInstructions'),
                instructionsContent: document.getElementById('instructionsContent')
            };

            // ============================================
            // Helper Functions
            // ============================================

            function generateId() {
                return `obj-${state.nextObjectId++}`;
            }

            function getThaiDate() {
                const date = new Date();
                const thaiYear = date.getFullYear() + 543;
                const formatter = new Intl.DateTimeFormat('th-TH', {
                    day: 'numeric',
                    month: 'long',
                    year: 'numeric'
                });
                let formatted = formatter.format(date);
                // Replace AD year with BE year
                formatted = formatted.replace(date.getFullYear().toString(), thaiYear.toString());
                return formatted;
            }

            function showLoading() {
                elements.loadingOverlay.style.display = 'flex';
            }

            function hideLoading() {
                elements.loadingOverlay.style.display = 'none';
            }

            function constrainPosition(x, y, width, height) {
                const paperRect = elements.a4Paper.getBoundingClientRect();
                const maxX = paperRect.width - width;
                const maxY = paperRect.height - height;

                return {
                    x: Math.max(0, Math.min(x, maxX)),
                    y: Math.max(0, Math.min(y, maxY))
                };
            }

            // ============================================
            // Object Management
            // ============================================

            function createObject(type, data) {
                const obj = {
                    id: generateId(),
                    type: type,
                    x: 50,
                    y: 50,
                    width: 200,
                    height: 200,
                    rotation: 0,
                    ...data
                };

                state.objects.push(obj);
                renderObject(obj);
                selectObject(obj.id);

                return obj;
            }

            function deleteObject(id) {
                const index = state.objects.findIndex(o => o.id === id);
                if (index !== -1) {
                    const element = document.getElementById(id);
                    if (element) {
                        element.remove();
                    }
                    state.objects.splice(index, 1);

                    if (state.selectedObjectId === id) {
                        state.selectedObjectId = null;
                    }
                }
            }

            function selectObject(id) {
                // Deselect previous
                if (state.selectedObjectId) {
                    const prevElement = document.getElementById(state.selectedObjectId);
                    if (prevElement) {
                        prevElement.classList.remove('selected');
                        const controls = prevElement.querySelector('.control-buttons');
                        const handle = prevElement.querySelector('.resize-handle');
                        if (controls) controls.style.display = 'none';
                        if (handle) handle.style.display = 'none';
                    }
                }

                // Select new
                state.selectedObjectId = id;
                const element = document.getElementById(id);
                if (element) {
                    element.classList.add('selected');
                    const controls = element.querySelector('.control-buttons');
                    const handle = element.querySelector('.resize-handle');
                    if (controls) controls.style.display = 'flex';
                    if (handle) handle.style.display = 'block';
                }
            }

            function deselectAll() {
                if (state.selectedObjectId) {
                    const element = document.getElementById(state.selectedObjectId);
                    if (element) {
                        element.classList.remove('selected');
                        const controls = element.querySelector('.control-buttons');
                        const handle = element.querySelector('.resize-handle');
                        if (controls) controls.style.display = 'none';
                        if (handle) handle.style.display = 'none';
                    }
                }
                state.selectedObjectId = null;
            }

            function rotateObject(id) {
                const obj = state.objects.find(o => o.id === id);
                if (obj) {
                    obj.rotation = (obj.rotation + 90) % 360;
                    updateObjectStyle(obj);
                }
            }

            function updateObjectStyle(obj) {
                const element = document.getElementById(obj.id);
                if (element) {
                    element.style.left = obj.x + 'px';
                    element.style.top = obj.y + 'px';
                    element.style.width = obj.width + 'px';
                    element.style.height = obj.height + 'px';
                    element.style.transform = `rotate(${obj.rotation}deg)`;
                }
            }

            // ============================================
            // Image Handling
            // ============================================

            function handleImageUpload(files) {
                Array.from(files).forEach(file => {
                    if (!file.type.match('image.*')) return;

                    const reader = new FileReader();
                    reader.onload = function(e) {
                        const img = new Image();
                        img.onload = function() {
                            const paperRect = elements.a4Paper.getBoundingClientRect();
                            const maxWidth = paperRect.width * 0.4;
                            const maxHeight = paperRect.height * 0.4;

                            let width, height;

                            // Use reference size if available
                            if (state.referenceImageWidth && state.referenceImageHeight) {
                                const aspectRatio = img.naturalWidth / img.naturalHeight;
                                width = state.referenceImageWidth;
                                height = width / aspectRatio;

                                // Ensure it doesn't exceed A4 bounds
                                if (height > paperRect.height * 0.8) {
                                    height = paperRect.height * 0.8;
                                    width = height * aspectRatio;
                                }
                                if (width > paperRect.width * 0.8) {
                                    width = paperRect.width * 0.8;
                                    height = width / aspectRatio;
                                }
                            } else {
                                // First image - calculate and save reference size
                                const aspectRatio = img.naturalWidth / img.naturalHeight;

                                if (aspectRatio > 1) {
                                    width = Math.min(img.naturalWidth, maxWidth);
                                    height = width / aspectRatio;
                                } else {
                                    height = Math.min(img.naturalHeight, maxHeight);
                                    width = height * aspectRatio;
                                }

                                // Save as reference
                                state.referenceImageWidth = width;
                                state.referenceImageHeight = height;
                            }

                            createObject('image', {
                                src: e.target.result,
                                width: width,
                                height: height,
                                naturalWidth: img.naturalWidth,
                                naturalHeight: img.naturalHeight
                            });
                        };
                        img.src = e.target.result;
                    };
                    reader.readAsDataURL(file);
                });
            }

            // ============================================
            // Certification Text
            // ============================================

            function updateCertTextDisplay() {
                const existing = state.objects.find(o => o.type === 'text' && o.subtype === 'certification');

                if (state.certTextSettings.show) {
                    if (existing) {
                        // Update existing
                        existing.name = state.certTextSettings.name;
                        existing.gap1 = state.certTextSettings.gap1;
                        existing.gap2 = state.certTextSettings.gap2;
                        updateCertTextElement(existing);
                    } else {
                        // Create new
                        const paperRect = elements.a4Paper.getBoundingClientRect();
                        createObject('text', {
                            subtype: 'certification',
                            name: state.certTextSettings.name,
                            gap1: state.certTextSettings.gap1,
                            gap2: state.certTextSettings.gap2,
                            width: 250,
                            height: 100,
                            x: paperRect.width / 2 - 125,
                            y: paperRect.height - 150
                        });
                    }
                } else {
                    if (existing) {
                        deleteObject(existing.id);
                    }
                }
            }

            function updateCertTextElement(obj) {
                const element = document.getElementById(obj.id);
                if (element) {
                    const content = element.querySelector('.cert-text');
                    if (content) {
                        content.innerHTML = `
                            <div class="cert-line-1">สำเนาถูกต้อง</div>
                            <div class="cert-line-2" style="margin-top: ${obj.gap1}px">${obj.name || '(ชื่อผู้รับรอง)'}</div>
                            <div class="cert-line-3" style="margin-top: ${obj.gap2}px">วันที่ ${getThaiDate()}</div>
                        `;
                    }
                }
            }

            // ============================================
            // Signature Canvas
            // ============================================

            function createSignatureCanvas() {
                const paperRect = elements.a4Paper.getBoundingClientRect();
                const canvas = document.createElement('canvas');
                const width = 300;
                const height = 150;

                canvas.width = width;
                canvas.height = height;

                const obj = createObject('signature', {
                    canvas: canvas,
                    width: width,
                    height: height,
                    x: paperRect.width / 2 - width / 2,
                    y: paperRect.height / 2 - height / 2,
                    paths: []
                });

                setupSignatureDrawing(obj);
            }

            function setupSignatureDrawing(obj) {
                const element = document.getElementById(obj.id);
                const canvas = obj.canvas;
                const ctx = canvas.getContext('2d');

                ctx.strokeStyle = '#000';
                ctx.lineWidth = 2;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';

                let isDrawing = false;
                let lastX = 0;
                let lastY = 0;

                function startDrawing(e) {
                    e.preventDefault();
                    e.stopPropagation();

                    isDrawing = true;
                    state.isDrawing = true;

                    const rect = canvas.getBoundingClientRect();
                    const clientX = e.clientX || (e.touches && e.touches[0].clientX);
                    const clientY = e.clientY || (e.touches && e.touches[0].clientY);

                    lastX = (clientX - rect.left) * (canvas.width / rect.width);
                    lastY = (clientY - rect.top) * (canvas.height / rect.height);

                    ctx.beginPath();
                    ctx.moveTo(lastX, lastY);

                    obj.paths.push({ type: 'start', x: lastX, y: lastY });
                }

                function draw(e) {
                    if (!isDrawing) return;

                    e.preventDefault();
                    e.stopPropagation();

                    const rect = canvas.getBoundingClientRect();
                    const clientX = e.clientX || (e.touches && e.touches[0].clientX);
                    const clientY = e.clientY || (e.touches && e.touches[0].clientY);

                    const x = (clientX - rect.left) * (canvas.width / rect.width);
                    const y = (clientY - rect.top) * (canvas.height / rect.height);

                    ctx.lineTo(x, y);
                    ctx.stroke();

                    obj.paths.push({ type: 'line', x: x, y: y });

                    lastX = x;
                    lastY = y;
                }

                function stopDrawing(e) {
                    if (!isDrawing) return;

                    e.preventDefault();
                    e.stopPropagation();

                    isDrawing = false;
                    state.isDrawing = false;
                    ctx.closePath();

                    obj.paths.push({ type: 'end' });
                }

                // Mouse events
                canvas.addEventListener('mousedown', startDrawing);
                canvas.addEventListener('mousemove', draw);
                canvas.addEventListener('mouseup', stopDrawing);
                canvas.addEventListener('mouseleave', stopDrawing);

                // Touch events (with passive: false to prevent scrolling)
                canvas.addEventListener('touchstart', startDrawing, { passive: false });
                canvas.addEventListener('touchmove', draw, { passive: false });
                canvas.addEventListener('touchend', stopDrawing, { passive: false });
                canvas.addEventListener('touchcancel', stopDrawing, { passive: false });
            }

            function clearSignature(obj) {
                const ctx = obj.canvas.getContext('2d');
                ctx.clearRect(0, 0, obj.canvas.width, obj.canvas.height);
                obj.paths = [];
            }

            // ============================================
            // Rendering
            // ============================================

            function renderObject(obj) {
                const div = document.createElement('div');
                div.id = obj.id;
                div.className = 'canvas-object';
                div.style.left = obj.x + 'px';
                div.style.top = obj.y + 'px';
                div.style.width = obj.width + 'px';
                div.style.height = obj.height + 'px';
                div.style.transform = `rotate(${obj.rotation}deg)`;
                div.style.zIndex = state.objects.length;

                // Content based on type
                if (obj.type === 'image') {
                    const img = document.createElement('img');
                    img.src = obj.src;
                    img.draggable = false;
                    div.appendChild(img);
                } else if (obj.type === 'text' && obj.subtype === 'certification') {
                    const textDiv = document.createElement('div');
                    textDiv.className = 'cert-text';
                    textDiv.innerHTML = `
                        <div class="cert-line-1">สำเนาถูกต้อง</div>
                        <div class="cert-line-2" style="margin-top: ${obj.gap1}px">${obj.name || '(ชื่อผู้รับรอง)'}</div>
                        <div class="cert-line-3" style="margin-top: ${obj.gap2}px">วันที่ ${getThaiDate()}</div>
                    `;
                    div.appendChild(textDiv);
                } else if (obj.type === 'signature') {
                    obj.canvas.className = 'signature-canvas';
                    div.appendChild(obj.canvas);
                }

                // Control buttons
                const controls = document.createElement('div');
                controls.className = 'control-buttons';
                controls.style.display = 'none';

                // Clear button (only for signature)
                if (obj.type === 'signature') {
                    const clearBtn = document.createElement('button');
                    clearBtn.className = 'control-btn';
                    clearBtn.innerHTML = '<i data-lucide="eraser" class="w-4 h-4"></i>';
                    clearBtn.setAttribute('aria-label', 'เคลียร์ลายเซ็น');
                    clearBtn.onclick = (e) => {
                        e.stopPropagation();
                        clearSignature(obj);
                    };
                    controls.appendChild(clearBtn);
                }

                // Rotate button
                const rotateBtn = document.createElement('button');
                rotateBtn.className = 'control-btn';
                rotateBtn.innerHTML = '<i data-lucide="rotate-cw" class="w-4 h-4"></i>';
                rotateBtn.setAttribute('aria-label', 'หมุน 90 องศา');
                rotateBtn.onclick = (e) => {
                    e.stopPropagation();
                    rotateObject(obj.id);
                };
                controls.appendChild(rotateBtn);

                // Delete button
                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'control-btn';
                deleteBtn.innerHTML = '<i data-lucide="trash-2" class="w-4 h-4"></i>';
                deleteBtn.setAttribute('aria-label', 'ลบวัตถุ');
                deleteBtn.onclick = (e) => {
                    e.stopPropagation();
                    if (confirm('ต้องการลบวัตถุนี้หรือไม่?')) {
                        deleteObject(obj.id);
                    }
                };
                controls.appendChild(deleteBtn);

                div.appendChild(controls);

                // Resize handle
                const handle = document.createElement('div');
                handle.className = 'resize-handle';
                handle.style.display = 'none';
                div.appendChild(handle);

                // Event listeners
                div.addEventListener('mousedown', (e) => handleObjectMouseDown(e, obj));
                div.addEventListener('touchstart', (e) => handleObjectTouchStart(e, obj), { passive: false });

                handle.addEventListener('mousedown', (e) => handleResizeMouseDown(e, obj));
                handle.addEventListener('touchstart', (e) => handleResizeTouchStart(e, obj), { passive: false });

                elements.a4Paper.appendChild(div);

                // Initialize Lucide icons
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            }

            // ============================================
            // Interaction Handlers
            // ============================================

            function handleObjectMouseDown(e, obj) {
                if (e.target.closest('.control-btn') || e.target.closest('.resize-handle')) {
                    return;
                }

                // Don't start drag if drawing on signature canvas
                if (obj.type === 'signature' && e.target.tagName === 'CANVAS') {
                    return;
                }

                e.preventDefault();
                e.stopPropagation();

                selectObject(obj.id);

                state.isDragging = true;
                state.dragStartX = e.clientX;
                state.dragStartY = e.clientY;
                state.initialObjectX = obj.x;
                state.initialObjectY = obj.y;
            }

            function handleObjectTouchStart(e, obj) {
                if (e.target.closest('.control-btn') || e.target.closest('.resize-handle')) {
                    return;
                }

                // Don't start drag if drawing on signature canvas
                if (obj.type === 'signature' && e.target.tagName === 'CANVAS') {
                    return;
                }

                e.preventDefault();
                e.stopPropagation();

                selectObject(obj.id);

                const touch = e.touches[0];
                state.isDragging = true;
                state.dragStartX = touch.clientX;
                state.dragStartY = touch.clientY;
                state.initialObjectX = obj.x;
                state.initialObjectY = obj.y;
            }

            function handleResizeMouseDown(e, obj) {
                e.preventDefault();
                e.stopPropagation();

                state.isResizing = true;
                state.dragStartX = e.clientX;
                state.dragStartY = e.clientY;
                state.initialObjectWidth = obj.width;
                state.initialObjectHeight = obj.height;

                selectObject(obj.id);
            }

            function handleResizeTouchStart(e, obj) {
                e.preventDefault();
                e.stopPropagation();

                const touch = e.touches[0];
                state.isResizing = true;
                state.dragStartX = touch.clientX;
                state.dragStartY = touch.clientY;
                state.initialObjectWidth = obj.width;
                state.initialObjectHeight = obj.height;

                selectObject(obj.id);
            }

            function handleMouseMove(e) {
                if (state.isDragging && state.selectedObjectId) {
                    const obj = state.objects.find(o => o.id === state.selectedObjectId);
                    if (obj) {
                        const dx = e.clientX - state.dragStartX;
                        const dy = e.clientY - state.dragStartY;

                        const newPos = constrainPosition(
                            state.initialObjectX + dx,
                            state.initialObjectY + dy,
                            obj.width,
                            obj.height
                        );

                        obj.x = newPos.x;
                        obj.y = newPos.y;
                        updateObjectStyle(obj);
                    }
                } else if (state.isResizing && state.selectedObjectId) {
                    const obj = state.objects.find(o => o.id === state.selectedObjectId);
                    if (obj) {
                        const dx = e.clientX - state.dragStartX;
                        const dy = e.clientY - state.dragStartY;

                        // Calculate new dimensions
                        if (obj.type === 'image' || obj.type === 'signature') {
                            // Maintain aspect ratio
                            const aspectRatio = state.initialObjectWidth / state.initialObjectHeight;
                            const newWidth = Math.max(50, state.initialObjectWidth + dx);
                            const newHeight = newWidth / aspectRatio;

                            // Constrain to paper bounds
                            const paperRect = elements.a4Paper.getBoundingClientRect();
                            if (obj.x + newWidth <= paperRect.width && obj.y + newHeight <= paperRect.height) {
                                obj.width = newWidth;
                                obj.height = newHeight;

                                // Update canvas size for signature
                                if (obj.type === 'signature') {
                                    const oldCanvas = obj.canvas;
                                    const newCanvas = document.createElement('canvas');
                                    newCanvas.width = newWidth;
                                    newCanvas.height = newHeight;
                                    const newCtx = newCanvas.getContext('2d');
                                    newCtx.drawImage(oldCanvas, 0, 0, newWidth, newHeight);
                                    obj.canvas = newCanvas;

                                    const element = document.getElementById(obj.id);
                                    const oldCanvasElement = element.querySelector('canvas');
                                    if (oldCanvasElement) {
                                        oldCanvasElement.replaceWith(newCanvas);
                                        newCanvas.className = 'signature-canvas';
                                        setupSignatureDrawing(obj);
                                    }
                                }

                                updateObjectStyle(obj);
                            }
                        } else {
                            // Allow free resize for text
                            const newWidth = Math.max(100, state.initialObjectWidth + dx);
                            const newHeight = Math.max(50, state.initialObjectHeight + dy);

                            const paperRect = elements.a4Paper.getBoundingClientRect();
                            if (obj.x + newWidth <= paperRect.width && obj.y + newHeight <= paperRect.height) {
                                obj.width = newWidth;
                                obj.height = newHeight;
                                updateObjectStyle(obj);
                            }
                        }
                    }
                }
            }

            function handleTouchMove(e) {
                if (state.isDrawing) {
                    // Let signature drawing handle it
                    return;
                }

                if ((state.isDragging || state.isResizing) && state.selectedObjectId) {
                    e.preventDefault();

                    const touch = e.touches[0];
                    const obj = state.objects.find(o => o.id === state.selectedObjectId);

                    if (state.isDragging && obj) {
                        const dx = touch.clientX - state.dragStartX;
                        const dy = touch.clientY - state.dragStartY;

                        const newPos = constrainPosition(
                            state.initialObjectX + dx,
                            state.initialObjectY + dy,
                            obj.width,
                            obj.height
                        );

                        obj.x = newPos.x;
                        obj.y = newPos.y;
                        updateObjectStyle(obj);
                    } else if (state.isResizing && obj) {
                        const dx = touch.clientX - state.dragStartX;
                        const dy = touch.clientY - state.dragStartY;

                        if (obj.type === 'image' || obj.type === 'signature') {
                            const aspectRatio = state.initialObjectWidth / state.initialObjectHeight;
                            const newWidth = Math.max(50, state.initialObjectWidth + dx);
                            const newHeight = newWidth / aspectRatio;

                            const paperRect = elements.a4Paper.getBoundingClientRect();
                            if (obj.x + newWidth <= paperRect.width && obj.y + newHeight <= paperRect.height) {
                                obj.width = newWidth;
                                obj.height = newHeight;

                                if (obj.type === 'signature') {
                                    const oldCanvas = obj.canvas;
                                    const newCanvas = document.createElement('canvas');
                                    newCanvas.width = newWidth;
                                    newCanvas.height = newHeight;
                                    const newCtx = newCanvas.getContext('2d');
                                    newCtx.drawImage(oldCanvas, 0, 0, newWidth, newHeight);
                                    obj.canvas = newCanvas;

                                    const element = document.getElementById(obj.id);
                                    const oldCanvasElement = element.querySelector('canvas');
                                    if (oldCanvasElement) {
                                        oldCanvasElement.replaceWith(newCanvas);
                                        newCanvas.className = 'signature-canvas';
                                        setupSignatureDrawing(obj);
                                    }
                                }

                                updateObjectStyle(obj);
                            }
                        } else {
                            const newWidth = Math.max(100, state.initialObjectWidth + dx);
                            const newHeight = Math.max(50, state.initialObjectHeight + dy);

                            const paperRect = elements.a4Paper.getBoundingClientRect();
                            if (obj.x + newWidth <= paperRect.width && obj.y + newHeight <= paperRect.height) {
                                obj.width = newWidth;
                                obj.height = newHeight;
                                updateObjectStyle(obj);
                            }
                        }
                    }
                }
            }

            function handleMouseUp() {
                state.isDragging = false;
                state.isResizing = false;
            }

            function handleTouchEnd() {
                state.isDragging = false;
                state.isResizing = false;
            }

            // ============================================
            // Export Functions
            // ============================================

            async function exportToImage() {
                showLoading();

                try {
                    // Hide all controls
                    document.querySelectorAll('.control-buttons, .resize-handle').forEach(el => {
                        el.style.display = 'none';
                    });

                    // Remove selection outline
                    document.querySelectorAll('.canvas-object').forEach(el => {
                        el.classList.remove('selected');
                    });

                    // Capture with html2canvas
                    const canvas = await html2canvas(elements.a4Paper, {
                        scale: 3,
                        useCORS: true,
                        backgroundColor: '#ffffff',
                        logging: false
                    });

                    const format = elements.exportFormat.value;

                    if (format === 'jpg') {
                        // Export as JPG
                        canvas.toBlob(function(blob) {
                            const url = URL.createObjectURL(blob);
                            const a = document.createElement('a');
                            a.href = url;
                            a.download = `a4-layout-${Date.now()}.jpg`;
                            document.body.appendChild(a);
                            a.click();
                            document.body.removeChild(a);
                            URL.revokeObjectURL(url);

                            hideLoading();
                            restoreControls();
                        }, 'image/jpeg', 0.95);
                    } else if (format === 'pdf') {
                        // Export as PDF
                        const imgData = canvas.toDataURL('image/jpeg', 0.95);

                        // Use jsPDF
                        const { jsPDF } = window.jspdf;
                        const pdf = new jsPDF({
                            orientation: 'portrait',
                            unit: 'mm',
                            format: 'a4'
                        });

                        // A4 dimensions in mm
                        const pdfWidth = 210;
                        const pdfHeight = 297;

                        // Add image to PDF with small margin
                        const margin = 5;
                        pdf.addImage(
                            imgData,
                            'JPEG',
                            margin,
                            margin,
                            pdfWidth - (margin * 2),
                            pdfHeight - (margin * 2)
                        );

                        pdf.save(`a4-layout-${Date.now()}.pdf`);

                        hideLoading();
                        restoreControls();
                    }
                } catch (error) {
                    console.error('Export error:', error);
                    alert('เกิดข้อผิดพลาดในการดาวน์โหลด กรุณาลองใหม่อีกครั้ง');
                    hideLoading();
                    restoreControls();
                }
            }

            function restoreControls() {
                // Restore controls for selected object
                if (state.selectedObjectId) {
                    const element = document.getElementById(state.selectedObjectId);
                    if (element) {
                        element.classList.add('selected');
                        const controls = element.querySelector('.control-buttons');
                        const handle = element.querySelector('.resize-handle');
                        if (controls) controls.style.display = 'flex';
                        if (handle) handle.style.display = 'block';
                    }
                }
            }

            // ============================================
            // Event Listeners Setup
            // ============================================

            function setupEventListeners() {
                // Image upload
                elements.imageUpload.addEventListener('change', function(e) {
                    if (e.target.files.length > 0) {
                        handleImageUpload(e.target.files);
                    }
                });

                // Certification text toggle
                elements.showCertText.addEventListener('change', function() {
                    state.certTextSettings.show = this.checked;
                    elements.certTextControls.style.display = this.checked ? 'block' : 'none';
                    updateCertTextDisplay();
                });

                // Certification name input
                elements.certName.addEventListener('input', function() {
                    state.certTextSettings.name = this.value;
                    updateCertTextDisplay();
                });

                // Gap sliders
                elements.gap1Slider.addEventListener('input', function() {
                    state.certTextSettings.gap1 = parseInt(this.value);
                    elements.gap1Value.textContent = this.value;
                    updateCertTextDisplay();
                });

                elements.gap2Slider.addEventListener('input', function() {
                    state.certTextSettings.gap2 = parseInt(this.value);
                    elements.gap2Value.textContent = this.value;
                    updateCertTextDisplay();
                });

                // Add signature button
                elements.addSignatureBtn.addEventListener('click', function() {
                    createSignatureCanvas();
                });

                // Download button
                elements.downloadBtn.addEventListener('click', function() {
                    exportToImage();
                });

                // Toggle instructions (mobile)
                elements.toggleInstructions.addEventListener('click', function() {
                    const content = elements.instructionsContent;
                    const icon = this.querySelector('[data-lucide]');

                    if (window.innerWidth < 768) {
                        content.classList.toggle('hidden');

                        if (content.classList.contains('hidden')) {
                            icon.setAttribute('data-lucide', 'chevron-down');
                        } else {
                            icon.setAttribute('data-lucide', 'chevron-up');
                        }

                        if (window.lucide) {
                            window.lucide.createIcons();
                        }
                    }
                });

                // Global mouse/touch events
                document.addEventListener('mousemove', handleMouseMove);
                document.addEventListener('mouseup', handleMouseUp);
                document.addEventListener('touchmove', handleTouchMove, { passive: false });
                document.addEventListener('touchend', handleTouchEnd);

                // Deselect when clicking on paper background
                elements.a4Paper.addEventListener('mousedown', function(e) {
                    if (e.target === elements.a4Paper) {
                        deselectAll();
                    }
                });

                elements.a4Paper.addEventListener('touchstart', function(e) {
                    if (e.target === elements.a4Paper) {
                        deselectAll();
                    }
                }, { passive: true });

                // Prevent default touch behaviors on A4 paper when interacting
                elements.a4Paper.addEventListener('touchstart', function(e) {
                    if (e.target.closest('.canvas-object') && !state.isDrawing) {
                        e.preventDefault();
                    }
                }, { passive: false });
            }

            // ============================================
            // Initialization
            // ============================================

            function init() {
                setupEventListeners();

                // Initialize Lucide icons
                if (window.lucide) {
                    window.lucide.createIcons();
                }

                console.log('A4 Image Layout Application initialized successfully');
            }

            // Wait for DOM and all libraries to load
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }
        })();
    </script>
